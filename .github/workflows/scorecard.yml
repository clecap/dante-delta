# OpenSSF Scorecard supply-chain security analysis, as in clecap/dante-wiki
# Results will be available at Github: Security / Code Scanning Alerts and at https://scorecard.dev/viewer/?uri=github.com/clecap/dante-delta
# publish_results provides the data for the Scorecard badge in README.md

name: Scorecard supply-chain security

on:
  branch_protection_rule:     # for the Branch-Protection check; only the default branch is supported
  schedule:
    - cron: '15 2 * * 0'      # keeps the Maintained check updated
  push:
    branches: [ "master" ]

permissions: read-all          # default permissions read only

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the results to the code-scanning dashboard
      id-token: write          # publish results and get a badge

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
