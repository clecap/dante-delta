# Taint analysis (security) of the PHP files of this repository with Phan and the MediaWiki taint-check plugin, configured in .phan/config.php
# Results will be available at Github: Security / Code Scanning Alerts
#
# This repository holds only the Dante delta; MediaWiki core is checked out next to it, so the taint check knows the sources and sinks of core
# Phan, its MediaWiki configuration and PHP are in the versions MediaWiki 1.39 uses, so the taint check matches the classes of this core version

name: Phan to Security / Code Scanning Alerts

on:
  push:
    paths:
      - 'extensions/**'
      - 'includes/**'
      - 'skins/**'
      - '*.php'                 # PHP files in the main directory only; * does not match /
      - '.phan/**'
      - '.github/scripts/phan-to-sarif.php'
      - '.github/workflows/phan.yml'
  pull_request:                 # run on proposed changes before they are merged
    paths:
      - 'extensions/**'
      - 'includes/**'
      - 'skins/**'
      - '*.php'
      - '.phan/**'
      - '.github/scripts/phan-to-sarif.php'
      - '.github/workflows/phan.yml'

permissions:
  contents: read

jobs:
  phan:
    name: Run Phan taint analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # MediaWiki core in the version we patch (see MW_VERSION in includes/Defines.php)
      - name: Checkout MediaWiki core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wikimedia/mediawiki
          ref: '1.39.0'
          path: mw-core

      # add core files around our delta, without overwriting our patched core files and our .phan/config.php, so the layout is the same as in a local installation
      - name: Merge MediaWiki core into the workspace
        run: |
          rsync -a --ignore-existing --exclude .git mw-core/ ./
          rm -rf mw-core

      # PHP 8.1 is the newest PHP supported by MediaWiki 1.39 and its Phan 5.2.0; php-ast in the version recommended by Phan 5.2.0
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: ast-1.0.16
          tools: composer
          coverage: none

      # libraries of core, so Phan also knows their classes; no scripts, since we only need the source;
      # Phan configuration in the version required by core 1.39 (composer.json, require-dev), in its own directory, so it does not mix with core's dependencies
      - name: Install core libraries and Phan
        run: |
          composer install --no-dev --no-scripts --no-interaction --no-progress --ignore-platform-reqs
          mkdir ../phan-tool
          composer require --working-dir=../phan-tool --no-interaction --no-progress mediawiki/mediawiki-phan-config:0.11.1

      - name: Run Phan
        run: ../phan-tool/vendor/bin/phan --no-progress-bar --output-mode json --output phan-results.json
        env:
          MW_PHAN_CONFIG: ${{ github.workspace }}/../phan-tool/vendor/mediawiki/mediawiki-phan-config/src/config.php
        continue-on-error: true   # findings make Phan exit with an error; they are reported by the upload below

      # Phan has no SARIF output; the conversion fails if Phan produced no readable output, so a crash is not mistaken for a clean result
      - name: Convert results to SARIF
        run: php .github/scripts/phan-to-sarif.php phan-results.json phan-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: phan-results.sarif
          category: phan
          wait-for-processing: true
