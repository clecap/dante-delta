# Pattern based security scanning of the files of this repository with Semgrep, using the public PHP and security-audit rule sets
# Results will be available at Github: Security / Code Scanning Alerts
#

name: Semgrep to Security / Code Scanning Alerts

on:
  push:
    paths:
      - 'extensions/**'
      - 'includes/**'
      - 'skins/**'
      - '*.php'                 # PHP files in the main directory only; * does not match /
      - '.github/workflows/semgrep.yml'
  pull_request:                 # run on proposed changes before they are merged
    paths:
      - 'extensions/**'
      - 'includes/**'
      - 'skins/**'
      - '*.php'
      - '.github/workflows/semgrep.yml'

permissions:
  contents: read

jobs:
  semgrep:
    name: Run Semgrep scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Semgrep
        run: pip install semgrep==1.180.0

      # rule sets are fetched from the public Semgrep registry; no account and no metrics needed
      - name: Run Semgrep
        run: semgrep scan
          --config p/php
          --config p/security-audit
          --metrics=off
          --sarif
          --output semgrep-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
          wait-for-processing: true
