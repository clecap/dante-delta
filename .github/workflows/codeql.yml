name: "CodeQL (mine)"

on:
  push:
    paths:
      - 'extensions/**'         
      - 'includes/**'
      - 'skins/**'
      - '*.php'                 # PHP files in the main directory only; * does not match /
  pull_request:            # run on proposed changes before they are merged
    paths:
      - 'extensions/**'
      - 'includes/**'
      - 'skins/**'
      - '*.php'                 # PHP files in the main directory only; * does not match /

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            continue-on-error: false
          # add further languages here, e.g. "- language: python", once the repository contains such source code

    continue-on-error: ${{ matrix.continue-on-error }}

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
