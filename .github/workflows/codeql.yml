name: "CodeQL (mine)"

on:
  push:
    paths:
      - 'extensions/**'         
      - 'includes/**'
      - 'skins/**'
      - '*.php'                 # PHP files in the main directory only; * does not match /
  pull_request:            # run on proposed changes before they are merged
    paths:
      - 'extensions/**'
      - 'includes/**'
      - 'skins/**'
      - '*.php'                 # PHP files in the main directory only; * does not match /

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            continue-on-error: false
          # add further languages here, e.g. "- language: python", once the repository contains such source code

    continue-on-error: ${{ matrix.continue-on-error }}

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@429e1977040da7a23b6822b13c129cd1ba93dbb2 # v3.26.2
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@429e1977040da7a23b6822b13c129cd1ba93dbb2 # v3.26.2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@429e1977040da7a23b6822b13c129cd1ba93dbb2 # v3.26.2
